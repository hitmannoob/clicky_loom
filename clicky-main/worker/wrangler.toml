name = "clicky-proxy"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
ELEVENLABS_VOICE_ID = "kPzsL2i3teMYv0FxEYQ6"

# R2 bucket binding for guide storage. The `clicky-guides` bucket must
# exist in the Cloudflare dashboard before `wrangler deploy` will accept
# this config. The binding name `GUIDE_BUCKET` is referenced from
# src/index.ts via `env.GUIDE_BUCKET`.
[[r2_buckets]]
binding = "GUIDE_BUCKET"
bucket_name = "clicky-guides"
